defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

checkpoint: weights/detection.ckpt

data:
  datadir: data/yeast_cell_in_microstructures_dataset
  batch_size: 32
  anchors: [[48, 72]]
  image_size: 256
  grid_size: 8
  ignore_iou_thresh: 0.5
  train_subdir: train
  val_subdir: val
  test_subdir: test

model:
  in_channels: 1
  num_classes: 2

trainer:
  accelerator: auto
  devices: 1
  log_every_n_steps: 10

nms_iou_threshold: 0.3
