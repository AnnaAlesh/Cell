seed: 42
output_dir: ${hydra:runtime.output_dir}
logdir: logs/
checkpoint: null

datamodule:
  datadir: data/yeast_cell_in_microstructures_dataset
  batch_size: 32
  train_subdir: train
  val_subdir: val
  test_subdir: test

model:
  name: tiny_unet
  n_channels: 1
  n_classes: 3
  channel_sizes: [8, 16, 32, 64]
  bilinear: true

optimizer:
  lr: 0.001
  weight_decay: 0.0

loss:
  name: cross_entropy
  smooth: 1.0e-6

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 30
  log_every_n_steps: 10

early_stopping:
  enabled: false
  patience: 10
  monitor: val/loss
  mode: min

hydra:
  run:
    dir: ${logdir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${logdir}/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}/
    subdir: ${hydra.job.override_dirname}
